<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vida y Ministerio Cristiano</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f2f2f2;
      font-family: 'Segoe UI', sans-serif;
      padding-bottom: 40px;
    }
    .navbar-nav .nav-link {
      padding: 0.5rem 0.3125rem;
      font-size: 0.8rem;
    }
    @media (max-width: 576px) {
      .navbar-nav .nav-link {
        font-size: 0.85rem;
        font-weight: 400;
        padding: 0.5rem 0.2rem;
      }
    }
    .programme-container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      padding: 30px;
      max-width: 900px;
      margin: 0 auto;
    }
    @media (max-width: 768px) {
      .programme-container {
        padding: 20px;
        border-radius: 5px;
      }
      .section-title {
        font-size: 0.85rem;
        padding: 8px 12px;
      }
    }
    @media (max-width: 576px) {
      .programme-container {
        padding: 15px;
        margin: 0 10px;
      }
      .header-info h2 {
        font-size: 1.1rem;
      }
      .header-info .week-info {
        font-size: 0.9rem;
      }
    }
    .header-info {
      margin-bottom: 30px;
    }
    .header-info h2 {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .header-info .week-info {
      font-size: 1rem;
      margin-bottom: 5px;
    }
    .header-info .president {
      font-size: 0.9rem;
      color: #666;
      text-align: right;
    }
    @media (max-width: 768px) {
      .header-info h2 {
        font-size: 1.2rem;
      }
      .header-info .president {
        text-align: left;
        margin-top: 10px;
      }
    }
    .section-title {
      color: white;
      padding: 10px 15px;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 25px;
      margin-bottom: 15px;
      font-size: 0.95rem;
      border-radius: 5px;
    }
    .section-title:first-of-type {
      margin-top: 0;
    }
    .gris { background-color: #4d4d4d; }
    .dorado { background-color: #c59f36; }
    .burdeos { background-color: #7c0c27; }
    .programme-row {
      display: flex;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      align-items: flex-start;
    }
    .programme-row:last-child {
      border-bottom: none;
    }
    .hora {
      min-width: 50px;
      font-weight: bold;
      color: #4d4d4d;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .descripcion {
      flex: 1;
      padding: 0 15px;
      font-size: 0.95rem;
    }
    .asignado {
      min-width: 150px;
      text-align: right;
      color: #333;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .asignado-label {
      font-size: 0.8rem;
      color: #666;
      font-style: italic;
    }
    @media (max-width: 768px) {
      .programme-row {
        flex-wrap: wrap;
      }
      .hora {
        min-width: 45px;
      }
      .descripcion {
        padding: 0 10px;
        flex: 1 1 55%;
      }
      .asignado {
        min-width: 100px;
        text-align: right;
        flex: 1 1 auto;
      }
    }
    @media (max-width: 576px) {
      .asignado {
        text-align: left;
        width: 100%;
        margin-left: 45px;
        margin-top: 5px;
      }
    }
    .cancion {
      font-weight: 600;
    }
    .week-pills {
      gap: 8px;
      flex-wrap: wrap;
    }
    .week-pills .nav-link {
      border: 1px solid #c9c9c9;
      background: #fff;
      color: #333;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 999px;
    }
    .week-pills .nav-link.active {
      background: #7c0c27;
      border-color: #7c0c27;
      color: #fff;
    }
  </style>
</head>
<body>
  <script src="assets/js/menu.js"></script>

  <!-- Título -->
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="text-center flex-grow-1">Vida y Ministerio</h1>
      <span id="status-indicator" class="badge bg-success">En línea</span>
    </div>
  </div>

  <div class="container mt-3">
    <div class="programme-container">
      <div id="offline-warning" class="alert alert-warning" style="display:none;">
        📡 Modo sin conexión. Mostrando última versión guardada.
      </div>
      <div id="week-tabs" class="mb-3"></div>
      <div id="header-container">
        <!-- Header dinámico se cargará aquí -->
      </div>
      <div id="programme-body">
        <!-- Contenido del programa se cargará aquí -->
      </div>
    </div>
  </div>

  <script src="assets/js/offline-support.js"></script>
  <script>
    // Helper para escapar HTML y prevenir XSS
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const SPREADSHEET_ID = '1cenbEEw_QskFr0b2OlglTEBh_b4gRfR7lOAYoH3ihlg';
    // Pestañas (una por semana). Para sumar una pestaña más, agregá su gid a esta lista.
    // Quien carga NO necesita tocar esto: alcanza con reemplazar el contenido de la pestaña
    // de la semana que ya pasó por la semana nueva.
    const SHEET_GIDS = ['1465351444', '323922141', '1157742617', '483034588'];
    const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

    function normText(s) {
      return (s || '').toString().normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase().trim();
    }

    // "13-19 DE ABRIL", "27 DE OCTUBRE-2 DE NOVIEMBRE", "27-2 DE NOVIEMBRE" -> Date del primer día (o null)
    function parseWeekStart(label, today) {
      const t = normText(label);
      const re = new RegExp('(\\d{1,2})(?:\\s*(?:de\\s+)?(' + MONTHS.join('|') + '))?', 'g');
      const pairs = [];
      let m;
      while ((m = re.exec(t)) !== null) {
        pairs.push({ day: parseInt(m[1], 10), month: m[2] ? MONTHS.indexOf(m[2]) : null });
      }
      if (!pairs.length) return null;
      const first = pairs[0], last = pairs[pairs.length - 1];
      let month = first.month !== null ? first.month : last.month;
      if (month === null) return null;
      if (first.month === null && pairs.length > 1 && first.day > last.day) month = (month + 11) % 12;
      let best = null;
      [-1, 0, 1].forEach(function (dy) {
        const d = new Date(today.getFullYear() + dy, month, first.day);
        if (best === null || Math.abs(d - today) < Math.abs(best - today)) best = d;
      });
      return best;
    }

    function titleCase(s) {
      s = (s || '').toLowerCase();
      return s.replace(/(^|\s|-)([a-záéíóúñ])/g, function (_, a, b) { return a + b.toUpperCase(); }).replace(/\sDe\s/g, ' de ');
    }

    let weeks = [];
    let selected = 0;

    async function loadProgramme() {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const results = await Promise.allSettled(SHEET_GIDS.map(function (gid) {
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&tq&gid=${gid}`;
        return fetchWithOfflineSupport(url, 'vida-ministerio-gid-' + gid);
      }));

      let anyCache = false;
      const loaded = [];
      results.forEach(function (r) {
        if (r.status !== 'fulfilled') return;
        if (r.value.fromCache) anyCache = true;
        const hc = document.createElement('div');
        const pb = document.createElement('div');
        processData(r.value.data, hc, pb);
        const h2 = hc.querySelector('h2');
        const label = h2 ? h2.textContent.trim() : '';
        if (!label && !pb.textContent.trim()) return; // pestaña vacía
        loaded.push({ label: label, start: parseWeekStart(label, today), hc: hc.innerHTML, pb: pb.innerHTML });
      });

      document.getElementById('offline-warning').style.display = anyCache ? 'block' : 'none';

      if (!loaded.length) {
        document.getElementById('programme-body').innerHTML =
          '<div class="alert alert-danger">❌ No hay conexión y no hay datos guardados. Conéctate a internet para cargar los datos.</div>';
        return;
      }

      // Orden por fecha; las que no se pudieron leer van al final
      loaded.sort(function (a, b) {
        if (a.start && b.start) return a.start - b.start;
        if (a.start) return -1;
        if (b.start) return 1;
        return 0;
      });
      // Se ocultan las semanas que ya terminaron (domingo = inicio + 6 días)
      const upcoming = loaded.filter(function (w) {
        if (!w.start) return true;
        const end = new Date(w.start); end.setDate(end.getDate() + 6);
        return end >= today;
      });
      weeks = upcoming.length ? upcoming : loaded.slice(-1);
      weeks.forEach(function (w, i) {
        const end = w.start ? new Date(w.start.getTime() + 6 * 86400000) : null;
        w.isCurrent = !!(w.start && w.start <= today && end >= today);
      });
      const curIdx = weeks.findIndex(function (w) { return w.isCurrent; });
      selected = curIdx >= 0 ? curIdx : 0;
      renderTabs();
      showWeek(selected);
    }

    function renderTabs() {
      const box = document.getElementById('week-tabs');
      if (weeks.length < 2) { box.innerHTML = ''; return; }
      const curIdx = weeks.findIndex(function (w) { return w.isCurrent; });
      box.innerHTML = '<div class="nav nav-pills week-pills">' + weeks.map(function (w, i) {
        let name = titleCase(w.label) || ('Semana ' + (i + 1));
        if (w.isCurrent) name = 'Esta semana';
        else if (curIdx >= 0 && i === curIdx + 1) name = 'Próxima semana';
        return '<button type="button" class="nav-link" data-week="' + i + '">' + escapeHtml(name) + '</button>';
      }).join('') + '</div>';
      box.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () { showWeek(parseInt(b.dataset.week, 10)); });
      });
    }

    function showWeek(i) {
      selected = i;
      const w = weeks[i];
      document.getElementById('header-container').innerHTML = w.hc;
      document.getElementById('programme-body').innerHTML = w.pb;
      document.querySelectorAll('#week-tabs .nav-link').forEach(function (b) {
        b.classList.toggle('active', parseInt(b.dataset.week, 10) === i);
      });
    }

    // Alias para que offline-support.js pueda llamarla
    window.loadData = loadProgramme;

    function processData(json, headerContainer, programmeBody) {
      try {
        let rows = json.table.rows;
        const headers = json.table.cols.map(col => col.label || col.id || '');

        // Normalizar texto: quitar acentos, pasar a minúsculas
        function normalize(s) {
          return (s || '').toString().normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase().trim();
        }

        function escapeHtml(str) {
          const div = document.createElement('div');
          div.textContent = str;
          return div.innerHTML;
        }

        // Buscar índices de columnas
        const normHeaders = headers.map(h => normalize(h));
        
        console.log('📋 ENCABEZADOS RECIBIDOS:', headers);
        console.log('📋 ENCABEZADOS NORMALIZADOS:', normHeaders);
        
        // Detectar si los encabezados contienen datos concatenados
        const tipoHeader = headers[0] || '';
        const fechaHeader = headers[1] || '';
        const horaHeader = headers[2] || '';
        const descripcionHeader = headers[3] || '';
        const asignadoHeader = headers[4] || '';
        const extraHeader = headers[5] || '';
        
        // Si los encabezados contienen "Header" o datos, reconstruir las filas faltantes
        if (normalize(tipoHeader).includes('header') || normalize(fechaHeader).includes('abril')) {
          console.log('🔧 Detectados datos condensados en encabezados. Reconstruyendo filas...');
          
          // Extraer las partes
          const tipoParts = tipoHeader.split(/\s+/);
          const fechaParts = fechaHeader.split(/\s+/);
          const horaParts = horaHeader.split(/\s+/);
          const descripcionParts = descripcionHeader.split(/\s+/);
          const asignadoParts = asignadoHeader.split(/\s+/);
          const extraParts = extraHeader.split(/\s+/);
          
          // Fila 1: HEADER
          const fecha = fechaParts.slice(1).join(' ').trim(); // "13-19 DE ABRIL"
          const escritura = horaParts.slice(1).join(' ').trim(); // "ISAÍAS 52,53"
          const presidente = extraParts.slice(1).join(' ').trim(); // "Jose V."
          
          // Fila 2: Canción
          const cancionMatch = descripcionHeader.match(/Canción\s+\d+/i);
          const cancion = cancionMatch ? cancionMatch[0] : '';
          
          // Fila 3: Tesoros
          const tesorosMatch = tipoHeader.match(/Tesoros?\s+de\s+la\s+Biblia/i) || 
                              tipoHeader.match(/Tesaoros?\s+de\s+la\s+Biblia/i);
          const tesoros = tesorosMatch ? tesorosMatch[0] : '';
          
          // Crear filas reconstruidas
          const reconstructedRows = [];
          
          // Header row
          if (fecha || escritura) {
            reconstructedRows.push({
              c: [
                { v: 'Header' },
                { v: fecha },
                { v: escritura },
                { v: cancion },
                { v: '' },
                { v: presidente }
              ]
            });
          }
          
          // Tesoros row
          if (tesoros) {
            reconstructedRows.push({
              c: [
                { v: tesoros },
                { v: '' },
                { v: '' },
                { v: '' },
                { v: '' },
                { v: '' }
              ]
            });
          }
          
          console.log(`✅ ${reconstructedRows.length} filas reconstruidas`);
          rows = [...reconstructedRows, ...rows];
        }
        
        let tipoIdx = normHeaders.findIndex(h => h.includes('tipo'));
        let fechaIdx = normHeaders.findIndex(h => h.includes('fecha'));
        let horaIdx = normHeaders.findIndex(h => h.includes('hora'));
        let descripcionIdx = normHeaders.findIndex(h => h.includes('descripcion'));
        let asignadoIdx = normHeaders.findIndex(h => h.includes('asignado'));
        let extraIdx = normHeaders.findIndex(h => h.includes('extra'));
        
        // Si no se encuentran encabezados, usar orden fijo
        if (tipoIdx === -1 || descripcionIdx === -1) {
          console.warn('⚠️ Usando orden fijo: Tipo(0), Fecha(1), Hora(2), Descripcion(3), Asignado(4), Extra(5)');
          tipoIdx = 0;
          fechaIdx = 1;
          horaIdx = 2;
          descripcionIdx = 3;
          asignadoIdx = 4;
          extraIdx = 5;
        }
        
        console.log('📊 ÍNDICES DE COLUMNAS:');
        console.log('  Tipo:', tipoIdx);
        console.log('  Fecha:', fechaIdx);
        console.log('  Hora:', horaIdx);
        console.log('  Descripcion:', descripcionIdx);
        console.log('  Asignado:', asignadoIdx);
        console.log('  Extra:', extraIdx);
        console.log('📝 TOTAL DE FILAS:', rows.length);


        let filasIgnoradas = 0;
        let filasProcesadas = 0;
        let i = 0;
        let bodyHTML = ''; // Acumular todo el HTML aquí

        while (i < rows.length) {
          const row = rows[i];
          
          if (!row.c) {
            console.log(`⚠️ Fila ${i}: sin datos (row.c es null)`);
            filasIgnoradas++;
            i++;
            continue;
          }

          const tipo = row.c[tipoIdx]?.v || '';
          const fecha = fechaIdx >= 0 ? (row.c[fechaIdx]?.v || '') : '';
          const hora = row.c[horaIdx]?.v || '';
          const descripcion = row.c[descripcionIdx]?.v || '';
          const asignado = asignadoIdx >= 0 ? (row.c[asignadoIdx]?.v || '') : '';
          const extra = extraIdx >= 0 ? (row.c[extraIdx]?.v || '') : '';

          console.log(`📄 Fila ${i}:`, { tipo, fecha, hora, descripcion, asignado, extra });

          // Si no hay descripción ni tipo ni fecha, ignorar
          if (!descripcion && !tipo && !fecha) {
            console.log(`⚠️ Fila ${i}: ignorada (sin descripcion, tipo, ni fecha)`);
            filasIgnoradas++;
            i++;
            continue;
          }

          filasProcesadas++;
          const tipoNorm = normalize(tipo);
          const descripcionNorm = normalize(descripcion);

          if (tipoNorm === 'header' || tipoNorm.includes('encabezado')) {
            // La escritura y el presidente pueden estar en la misma fila o en la siguiente
            let escritura = hora || '';
            let presidente = extra || '';
            
            // Si no están en la misma fila, buscar en la siguiente
            if (!escritura && !presidente && i + 1 < rows.length && rows[i + 1].c) {
              const nextRow = rows[i + 1];
              escritura = nextRow.c[horaIdx]?.v || '';
              presidente = nextRow.c[extraIdx]?.v || '';
              
              // Saltar la siguiente fila ya que la procesamos aquí
              if (escritura || presidente) {
                i++; // Avanzar el índice para saltar la fila siguiente
                console.log(`📄 Fila ${i}: combinada con header (escritura: ${escritura}, presidente: ${presidente})`);
              }
            }
            
            // Encabezado del programa
            headerContainer.innerHTML = `
              <div class="header-info">
                <div class="row">
                  <div class="col-md-12">
                    <h2>${escapeHtml(fecha)}</h2>
                    ${escritura ? `<div class="week-info">${escapeHtml(escritura)}</div>` : ''}
                  </div>
                </div>
              </div>
            `;
            
            // Renderizar la canción con el presidente
            if (descripcion) {
              let asignadoHtml = '';
              if (presidente) {
                asignadoHtml = `<div class="asignado-label">Presidente y oración</div><div>${escapeHtml(presidente)}</div>`;
              }
              
              bodyHTML += `
                <div class="programme-row">
                  <div class="hora"></div>
                  <div class="descripcion cancion">● ${escapeHtml(descripcion)}</div>
                  <div class="asignado">${asignadoHtml}</div>
                </div>
              `;
            }
          } else if (tipoNorm.includes('tesoro') || descripcionNorm.includes('tesoro') || tipoNorm.includes('biblia')) {
            // Título de sección TESOROS
            const textoSeccion = (tipo.length > 10 ? tipo : descripcion) || 'TESOROS DE LA BIBLIA';
            bodyHTML += `<div class="section-title gris">${escapeHtml(textoSeccion)}</div>`;
          } else if (tipoNorm.includes('maestro') || tipoNorm.includes('mejor') || tipoNorm.includes('seamos') || descripcionNorm.includes('maestro')) {
            // Título de sección SEAMOS
            const textoSeccion = (tipo.length > 10 ? tipo : descripcion) || 'SEAMOS MEJORES MAESTROS';
            bodyHTML += `<div class="section-title dorado">${escapeHtml(textoSeccion)}</div>`;
          } else if (tipoNorm.includes('vida') || tipoNorm.includes('cristiana') || descripcionNorm.includes('cristiana')) {
            // Título de sección VIDA
            const textoSeccion = (tipo.length > 10 ? tipo : descripcion) || 'NUESTRA VIDA CRISTIANA';
            bodyHTML += `<div class="section-title burdeos">${escapeHtml(textoSeccion)}</div>`;
          } else if (tipoNorm === 'cancion' || tipoNorm.includes('cancion') || descripcion.toLowerCase().includes('canción') || descripcion.toLowerCase().includes('cancion')) {
            // Canción
            let asignadoHtml = '';
            if (asignado) {
              if (extra) {
                asignadoHtml = `<div class="asignado-label">${escapeHtml(extra)}</div><div>${escapeHtml(asignado)}</div>`;
              } else {
                asignadoHtml = escapeHtml(asignado);
              }
            }
            bodyHTML += `
              <div class="programme-row">
                <div class="hora">${escapeHtml(String(hora))}</div>
                <div class="descripcion cancion">● ${escapeHtml(descripcion)}</div>
                <div class="asignado">${asignadoHtml}</div>
              </div>
            `;
          } else {
            // Item normal del programa
            let asignadoHtml = '';
            if (asignado) {
              if (extra) {
                asignadoHtml = `<div class="asignado-label">${escapeHtml(extra)}</div><div>${escapeHtml(asignado)}</div>`;
              } else {
                asignadoHtml = escapeHtml(asignado);
              }
            }
            bodyHTML += `
              <div class="programme-row">
                <div class="hora">${escapeHtml(String(hora))}</div>
                <div class="descripcion">${escapeHtml(descripcion)}</div>
                <div class="asignado">${asignadoHtml}</div>
              </div>
            `;
          }
          
          i++; // Avanzar al siguiente índice
        }

        // Asignar todo el HTML de una sola vez
        programmeBody.innerHTML = bodyHTML;

        console.log('✅ RESUMEN:');
        console.log(`  Filas procesadas: ${filasProcesadas}`);
        console.log(`  Filas ignoradas: ${filasIgnoradas}`);
        console.log(`  Header generado: ${headerContainer.innerHTML.length > 0 ? 'SÍ' : 'NO'}`);
        console.log(`  Body generado: ${programmeBody.innerHTML.length > 0 ? 'SÍ' : 'NO'}`);
        console.log(`  Longitud del bodyHTML: ${bodyHTML.length}`);

      } catch (err) {
        console.error('❌ Error procesando datos:', err);
        programmeBody.innerHTML = 
          '<div class="alert alert-danger">Error al procesar los datos: ' + err.message + '</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadProgramme);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
